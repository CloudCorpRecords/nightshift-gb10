name: Code Quality
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install flake8 bandit
      - run: python3 -m flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503,E402
      - run: python3 -m bandit -r src/ -ll --skip=B310
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m unittest discover tests -v
